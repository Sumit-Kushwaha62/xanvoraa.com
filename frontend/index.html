    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        const isAdmin = window.location.pathname.startsWith('/admin')
        let theme = 'dark'
        try {
          const stored = window.localStorage.getItem('xanvoraa-theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          }
        } catch {}
        const root = document.documentElement
        const activeTheme = isAdmin ? 'dark' : theme
        if (activeTheme === 'light') {
          root.classList.remove('dark-mode')
          root.classList.add('light-mode')
        } else {
          root.classList.remove('light-mode')
          root.classList.add('dark-mode')
        }
        // Enable CSS theme transitions only after the first frame has painted,
        // so the initial render never triggers a visible flash.
        requestAnimationFrame(() => { root.classList.add('theme-ready') })
      })()
    </script>
    <meta name="keywords" content="software development Jabalpur, web development Jabalpur, mobile app development, custom software, Xanvoraa Technologies" />
