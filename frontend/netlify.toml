[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  PUPPETEER_CACHE_DIR = "node_modules/.cache/puppeteer"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
